<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Management</title>
</head>
<body>
    <h1>File Management Dashboard</h1>
    <button onclick="triggerAction('/trigger')">Run Script</button>
    <button onclick="triggerAction('/clear-reports')">Clear Reports Directory</button>
    <button onclick="triggerAction('/clear-discard')">Clear Discard Directory</button>
    <button onclick="triggerAction('/clear-htmls')">Clear HTMLs Directory</button>
    <div id="output"></div>

    <script>
        function triggerAction(endpoint) {
            fetch(endpoint, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    const outputDiv = document.getElementById('output');
                    outputDiv.innerHTML = `<p>${data.message}</p>`;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
